          go test -p 2 -race ./internal/api/handlers/management ./internal/api ./internal/logging ./internal/store ./internal/tui ./internal/auth/codex ./sdk/auth -skip '^(TestResponsesInterruptStopsHTTPUpstream|TestPutOpenAICompatConcurrentWithAuthFieldsPatch_Issue6559)$' -count=1
          go test -p 2 -race ./internal/api/handlers/management ./internal/api -run '^TestValidatorPR9' -count=3
          go test -p 2 -race ./internal/api/handlers/management -run '^(TestA234|TestA232|TestA249)' -count=3
