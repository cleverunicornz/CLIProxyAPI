          go test -p 2 -race ./internal/access/... ./sdk/access ./sdk/api/handlers ./internal/api ./sdk/cliproxy/auth ./internal/runtime/executor/helps -skip '^(TestResponsesInterruptStopsHTTPUpstream|TestPutOpenAICompatConcurrentWithAuthFieldsPatch_Issue6559)$' -count=1
