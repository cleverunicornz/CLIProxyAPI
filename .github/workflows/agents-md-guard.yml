name: agents-md-guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-when-agents-md-changed:
    runs-on: {group: ci, labels: automation-test-s}
    steps:
      - name: Detect AGENTS.md changes not carried from upstream
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const touchesAgentsMd = (path) =>
              typeof path === "string" &&
              (path === "AGENTS.md" || path.endsWith("/AGENTS.md"));

            const touched = files.filter(
              (f) => touchesAgentsMd(f.filename) || touchesAgentsMd(f.previous_filename),
            );

            if (touched.length === 0) {
              core.info("No AGENTS.md changes detected.");
              return;
            }

            // AGENTS.md changes are allowed only when carried verbatim from an
            // upstream sync: every touched path's blob at the PR head must
            // match fork main, which advances only through upstream-sync PRs.
            // External fork heads fail this comparison because their blobs are
            // not readable through this repository.
            const headRef = context.payload.pull_request.head.sha;
            const blobSha = async (ref, path) => {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, ref, path });
                return data.type === "file" ? data.sha : null;
              } catch (error) {
                return null;
              }
            };

            const stray = [];
            for (const f of touched) {
              const headBlob = await blobSha(headRef, f.filename);
              const mainBlob = await blobSha("heads/main", f.filename);
              if (headBlob !== mainBlob || headBlob === null) {
                stray.push(f);
              }
            }

            if (stray.length === 0) {
              core.info(
                "AGENTS.md changes match fork main verbatim (upstream-carried).",
              );
              return;
            }

            const changedList = stray
              .map((f) =>
                f.previous_filename && f.previous_filename !== f.filename
                  ? `- ${f.previous_filename} -> ${f.filename}`
                  : `- ${f.filename}`,
              )
              .join("\n");

            const body = [
              "This repository allows AGENTS.md changes only when carried verbatim from an upstream sync (byte-identical to fork `main`).",
              "",
              "Detected changes:",
              changedList,
              "",
              "Please revert these changes and open a new PR without local AGENTS.md edits.",
            ].join("\n");

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              core.warning(`Failed to comment on PR #${prNumber}: ${error.message}`);
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              state: "closed",
            });

            core.setFailed("PR modifies AGENTS.md beyond upstream-carried content");
