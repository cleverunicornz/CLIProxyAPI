name: translator-path-guard

on:
  pull_request:
    branches: [internal/main]

permissions:
  contents: read

jobs:
  ensure-no-translator-changes:
    runs-on: {group: ci, labels: automation-test-s}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect restricted translator changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- internal/translator/)"; then
            echo 'Changes under internal/translator require upstream maintenance.'
            exit 1
          fi
