name: internal-release

# Builds the linux/amd64 no-plugin archive the way upstream's release.yaml
# does. Pull requests into internal/main run the build only. A manual dispatch
# from internal/main with release_tag set also publishes a GitHub release with
# the archive and its checksums.txt. Nothing publishes on a pull request or a
# push. Tag naming is documented in FORK.md.

on:
  pull_request:
    branches: [internal/main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a release from internal/main as v<upstream version>-cvu.<n> (empty to build only)
        type: string
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'

jobs:
  release-build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ci, labels: build-native}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      models_commit: ${{ steps.models.outputs.commit }}
    steps:
      - name: Check release request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/internal/main ]]; then
            echo "::error::releases publish from internal/main only, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cvu\.[1-9][0-9]*$ ]]; then
            echo "::error::release_tag must be v<upstream version>-cvu.<n>, for example v8.0.15-cvu.1"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check tag is unused
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::tag $RELEASE_TAG already exists; choose the next -cvu.<n>"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        id: models
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/refresh-model-catalogs.sh
          echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate Build Metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          if [[ -n "${RELEASE_TAG:-}" ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="dev-${commit}"
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "RELEASE_VERSION=$version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf >/dev/null || sudo apt-get install -y binutils

          archive_dir="dist/linux-amd64-no-plugin/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_amd64_no-plugin.tar.gz"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          mkdir -p release
          tar -C "$archive_dir" -czf "release/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          (cd release && sha256sum CLIProxyAPI_*.tar.gz | sort -k2 > checksums.txt)
          cat release/checksums.txt
      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail
          cd release
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_amd64_no-plugin.tar.gz"
          test "$(ls | sort)" = "$(printf '%s\n' "$archive_name" checksums.txt | sort)"
          test "$(wc -l < checksums.txt)" = 1
          sha256sum --check --strict checksums.txt
          test "$(tar -tzf "$archive_name" | sort)" = "$(printf '%s\n' LICENSE README.md README_CN.md cli-proxy-api config.example.yaml | sort)"
          unpacked="$(mktemp -d)"
          tar -C "$unpacked" -xzf "$archive_name"
          # The binary prints its embedded build identity first, then the flag usage.
          banner="$(cd "$unpacked" && ./cli-proxy-api -h 2>&1 | head -n 1 || true)"
          echo "$banner"
          test "$banner" = "CLIProxyAPI Version: ${RELEASE_VERSION}, Commit: ${COMMIT}, BuiltAt: ${BUILD_DATE}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-no-plugin
          path: release/
          if-no-files-found: error

  release-publish:
    needs: release-build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: {group: ci, labels: automation-test-s}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-no-plugin
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.release-build.outputs.version }}
          COMMIT: ${{ needs.release-build.outputs.commit }}
          BUILD_DATE: ${{ needs.release-build.outputs.build_date }}
          MODELS_COMMIT: ${{ needs.release-build.outputs.models_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/internal/main
          test "$VERSION" = "${RELEASE_TAG#v}"
          cd release
          sha256sum --check --strict checksums.txt
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Organization fork build of CLIProxyAPI from \`internal/main\` at ${GITHUB_SHA}.

          - \`CLIProxyAPI_${VERSION}_linux_amd64_no-plugin.tar.gz\`: linux/amd64, built without CGO the same way as upstream's no-plugin archive. It does not support dynamic library plugins.
          - \`checksums.txt\`: SHA-256 of the archive; verify with \`sha256sum --check checksums.txt\`.

          The binary reports \`CLIProxyAPI Version: ${VERSION}, Commit: ${COMMIT}, BuiltAt: ${BUILD_DATE}\`.
          Go ${GO_VERSION}; embedded model catalog from router-for-me/models at ${MODELS_COMMIT}.
          Fork changes and the tag scheme are described in FORK.md.
          EOF
          gh release create "$RELEASE_TAG" CLIProxyAPI_*.tar.gz checksums.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$notes"
